services:
  music-assistant:
    image: ghcr.io/music-assistant/server:2.10.9@sha256:4ac0d5844363fbbefd6a61251df09d96cd546e05e01b8c1cc1a28803f0935e07
    container_name: music-assistant
    # Keep the image's default user: AirPlay 2 PTP must bind UDP 319/320.
    # A plain non-root Docker user loses NET_BIND_SERVICE, even with cap_add.
    restart: unless-stopped
    stop_grace_period: 30s
    # Native speaker discovery and streaming require direct LAN access.
    network_mode: host
    environment:
      TZ: Europe/London
      LOG_LEVEL: info
    volumes:
      - ./data:/data
    # Navidrome supplies the library through Open Subsonic; no music mount needed.
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/info', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
