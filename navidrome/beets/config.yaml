plugins: chroma musicbrainz mbtwopass fetchart embedart lyrics lastgenre scrub replaygain mbsync the duplicates missing importadded info smartplaylist inline types ftintitle
# /opt/beets-plugins ships with the image and must come first: /data is a bind
# mount in every deployment, so anything baked under it is hidden at runtime.
# The Dockerfile pre-creates /data/beets-plugins as an empty 0755 directory;
# users may bind-mount their own directory there to extend any tier.
pluginpath:
  - /opt/beets-plugins
  - /data/beets-plugins
directory: /music # Mapped in docker-compose
import:
  copy: no
  move: yes
  resume: no
  # Keep existing library tracks when a duplicate is encountered.
  duplicate_action: skip
  quiet_fallback: skip
  write: yes
paths:
  default: $albumartist/$album%aunique{}/$track $title
  singleton: Singles/$artist/$title
match:
  strong_rec_thresh: 0.10
  max_rec:
    missing_tracks: low
musicbrainz:
  searchlimit: 20            # Recommendation from: https://github.com/kernitus/beets-oldestdate
  extra_tags:                # Enable improved MediaBrainz queries from tags.
    [
      catalognum,
      country,
      label,
      media,
      year
    ]
# Wire the replaygain plugin to the ffmpeg backend. Dormant on light / medium
# tiers (the plugin is not enabled in `plugins:` there). Load-bearing on full,
# where it avoids beets' gstreamer default which requires PyGObject and is not
# available on distroless. Plan 16-03 ships the static ffmpeg binary that
# satisfies this backend at runtime.
replaygain:
  backend: ffmpeg
  overwrite: yes

# Preserve Unicode artist and track names.
asciify_paths: no
fetchart:
  auto: yes
  cautious: yes
  minwidth: 500
  maxwidth: 1500
embedart:
  auto: yes
lyrics:
  auto: yes
  synced: yes
